apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: victim-oom
spec:
  mode: all
  duration: "600s" # stopped early by teardown (CR deletion)
  selector:
    labelSelectors:
      app: victim
    namespaces:
      - tsa-oom
  stressors:
    memory:
      workers: 1
      # Absolute size, deliberately just over the victim's 32Mi limit: OOMs the
      # victim's cgroup while remaining harmless (36Mi) even if the stressor
      # ever ran at node level. (A percentage like "100" would be ambiguous and
      # node-relative interpretation would pressure the whole node.)
      size: "36M"
