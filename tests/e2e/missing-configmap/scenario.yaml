name: missing-configmap
title: Missing ConfigMap dependency (CreateContainerConfigError)
wait:
  pod: victim
  type: containerconfigerror
  timeout_s: 120
alert:
  alertname: KubePodNotReady
  severity: critical
  annotations:
    summary: "Pod stuck in ContainerCreating and never becomes ready"
    description: "The pod has been pending for several minutes; the container never starts."
ground_truth: "The pod cannot start because it mounts a ConfigMap (app-config) that does not exist; create the config or fix the reference."
expect_tools: [pods_get, pods_list_in_namespace, events_list]
runbook: crashloopbackoff.md # "missing dependency" branch
