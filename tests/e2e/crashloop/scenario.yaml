name: crashloop
title: CrashLoopBackOff — app exits non-zero at startup
wait:
  pod: victim
  type: crashloop
  timeout_s: 180
alert:
  alertname: KubePodCrashLooping
  severity: critical
  annotations:
    summary: "Pod is crash-looping"
    description: "The pod has entered CrashLoopBackOff with a rising restart count."
ground_truth: "The application exits with a non-zero code at startup (config validation failure); inspect last state and previous logs."
expect_tools: [pods_get, pods_log, events_list]
runbook: crashloopbackoff.md
