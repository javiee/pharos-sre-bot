apiVersion: chaos-mesh.org/v2alpha1
kind: PodChaos
metadata:
  name: victim-crashloop
spec:
  action: pod-failure # make the container fail repeatedly -> CrashLoopBackOff
  mode: all
  duration: "600" # stopped early by teardown (CR deletion)
  selector:
    labelSelectors:
      app: victim
    namespaces:
      - tsa-crashloop-podfailure
