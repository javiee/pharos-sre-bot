name: crashloop-podfailure
title: CrashLoopBackOff via PodChaos pod-failure
wait:
  pod: victim
  type: crashloop
  timeout_s: 180
alert:
  alertname: KubePodCrashLooping
  severity: critical
  annotations:
    summary: "Pod is crash-looping"
    description: "The pod has entered CrashLoopBackOff with a rising restart count."
ground_truth: "The container is repeatedly failing at runtime and the pod is crash-looping; inspect last state and previous logs."
expect_tools: [pods_get, pods_log, events_list]
runbook: crashloopbackoff.md
