apiVersion: chaos-mesh.org/v2alpha1
kind: NetworkChaos
metadata:
  name: backend-partition
spec:
  action: partition
  # SMOKE-GATE: direction semantics verified in the network smoke run. Selecting
  # the BACKEND keeps the api->backend path broken under either semantics.
  direction: to
  mode: all
  duration: "600" # stopped early by teardown (CR deletion)
  selector:
    labelSelectors:
      app: backend
    namespaces:
      - tsa-network-partition
