apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: api-to-backend-delay
spec:
  action: delay
  mode: all
  duration: "600s" # stopped early by teardown (CR deletion)
  selector:
    labelSelectors:
      app: api
    namespaces:
      - tsa-network-delay
  # v1alpha1 (2.8.x) names the destination selector `target` (a full PodSelector)
  target:
    mode: all
    selector:
      labelSelectors:
        app: backend
      namespaces:
        - tsa-network-delay
  delay:
    latency: "800ms"
    correlation: "100"
