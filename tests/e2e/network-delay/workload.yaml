# api -> backend: a tiny two-hop "webserver" so a network delay on the
# api->backend hop is visible as elevated end-to-end latency.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: python:alpine
          imagePullPolicy: IfNotPresent
          command:
            - python
            - "-c"
            - |
              from http.server import BaseHTTPRequestHandler,HTTPServer
              import urllib.request
              def _up():
                  try:
                      r=urllib.request.urlopen('http://backend:8080/',timeout=10);return 200,r.read()
                  except Exception as e:
                      return 502,str(e).encode()
              H=type('H',(BaseHTTPRequestHandler,),{'do_GET':lambda s:(s.send_response(*_up()[:1]),s.end_headers(),s.wfile.write(_up()[1])),'log_message':lambda *a:None})
              HTTPServer(('0.0.0.0',8080),H).serve_forever()
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 128Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: python:alpine
          imagePullPolicy: IfNotPresent
          command:
            - python
            - "-c"
            - |
              from http.server import BaseHTTPRequestHandler,HTTPServer
              H=type('H',(BaseHTTPRequestHandler,),{'do_GET':lambda s:(s.send_response(200),s.end_headers(),s.wfile.write(b'backend-ok')),'log_message':lambda *a:None})
              HTTPServer(('0.0.0.0',8080),H).serve_forever()
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 128Mi
---
# Deployments have no DNS name; the api reaches the backend via this Service.
# MUST be headless: chaos-mesh targets the backend by POD IP, and traffic
# addressed to a ClusterIP is DNATed in the node netns, so the source pod's
# egress never shows the pod IP and the chaos ipset can never match.
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  clusterIP: None
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
